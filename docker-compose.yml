services:
  postgres-keycloak:
    image: postgres:15
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    networks:
      - nexdatum                           # Rename your network as you need
    volumes:
      - pg_keycloak_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak_server
    command:
      - start-dev
      - --spi-theme-static-max-age=-1       # With these three lines, you can customize the Keycloak theme without rebooting docker-compose. Just refresh the browser. This part (--spi-theme...) can be deleted after customization is complete.
      - --spi-theme-cache-themes=false
      - --spi-theme-cache-templates=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_PROXY: edge
      JAVA_OPTS: "-Dkeycloak.theme.cacheTemplates=false -Dkeycloak.theme.debug=true"  # This part can be deleted after customization is complete.
    ports:
      - "8282:8080"
    volumes:
      - ./themes/:/opt/keycloak/themes
    networks:
      - nexdatum                         # Rename your network as you need
    depends_on:
      - postgres-keycloak

networks:
  nexdatum:
    name: nexdatum                      # Rename your network as you need

volumes:
  pg_keycloak_data:
